<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle Inspection Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Vehicle Inspection Portal</h1>
  </header>

  <main>
    <section class="card">
      <h2>Welcome</h2>
      <p>This is a local portal for managing vehicle inspections. Records are stored in <code>data.json</code> and files in the <code>uploads/</code> folder.</p>
    </section>

    <section class="card">
      <h2>Admin</h2>
      <p><a href="admin.html">Open Admin page</a> to create inspections and upload links.</p>
    </section>

    <section class="card">
      <h2>System Status</h2>
      <p id="status">Checking server...</p>
      <ul>
        <li>Vehicles: <strong id="vehicle-count">-</strong></li>
        <li>Inspections: <strong id="inspection-count">-</strong></li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
